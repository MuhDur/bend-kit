name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BEND_NO_TELEMETRY: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      http: ${{ steps.list.outputs.http }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            pkgs=$(scripts/packages.sh "origin/${{ github.base_ref }}")
          else
            pkgs=$(scripts/packages.sh)
          fi
          echo "packages=$(jq -Rnc '[inputs | select(length > 0)]' <<<"$pkgs")" >> "$GITHUB_OUTPUT"
          echo "http=$(grep -qx http <<<"$pkgs" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, matrix.package) || format('publish-{0}', matrix.package) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: scripts/install-bend.sh
      - name: Check ${{ matrix.package }}
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          scripts/check.sh ${{ matrix.package }}
      - name: Native check ${{ matrix.package }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cs=(${{ matrix.package }}/effs/*.c)
          if [ ${#cs[@]} -eq 0 ]; then
            echo "no C effects"
            exit 0
          fi
          export PATH="$HOME/.bend/bin:$PATH"
          scripts/native-check.sh ${{ matrix.package }}
      - name: Compare ${{ matrix.package }} with the hub
        if: github.event_name == 'pull_request'
        run: scripts/publish.sh --check ${{ matrix.package }}
      - name: Publish ${{ matrix.package }}
        if: github.event_name == 'push'
        env:
          BEND_KEY: ${{ secrets.BEND_KEY }}
          BEND_LOGIN: ${{ secrets.BEND_LOGIN }}
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          jq -n '{key: env.BEND_KEY, login: env.BEND_LOGIN}' > ~/.bend/bender.json
          scripts/publish.sh ${{ matrix.package }}

  smoke:
    needs: changes
    if: needs.changes.outputs.http == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pr-{0}-smoke', github.event.pull_request.number) || 'publish-smoke' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: http
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: ../scripts/install-bend.sh
      - name: Live fetch smoke
        continue-on-error: true
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          bend smoke.bend | tee smoke.out
          ! grep -q '^fail ' smoke.out
      - name: Serve smoke
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          bend demo.bend -o demo
          ./demo > demo.log 2>&1 &
          curl -s --retry 20 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:18080/
          test "$(curl -s --data-binary @../README.md http://127.0.0.1:18080/hi)" = /hi
          test "$(curl --http1.1 -sv -o /dev/null -o /dev/null http://127.0.0.1:18080/one http://127.0.0.1:18080/two 2>&1 | grep -c 'Re-using existing connection')" = 1
          test "$(printf 'GET /old HTTP/1.0\r\n\r\n' | nc -q 3 127.0.0.1 18080 | tail -c 4)" = /old
          curl -s -o /dev/null -w '%{http_code}' -H 'Transfer-Encoding: gzip' -d x http://127.0.0.1:18080/ | grep -qx 400
          curl -s -o /dev/null -w '%{http_code}' -H "X-A: $(head -c 70000 /dev/zero | tr '\0' a)" http://127.0.0.1:18080/ | grep -qx 431
          python3 reject_check.py
      - name: Streamed request smoke
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          bend stream_demo.bend -o stream_demo
          python3 stream_check.py ./stream_demo
      - name: Response writer smoke
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          bend write_demo.bend -o write_demo
          python3 write_check.py ./write_demo

  gate:
    name: gate
    needs: [changes, check, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required job failed
        run: |
          case "${{ needs.changes.result }}" in
            success) ;;
            *) echo "changes is ${{ needs.changes.result }}"; exit 1 ;;
          esac
          case "${{ needs.check.result }}" in
            success|skipped) ;;
            *) echo "check is ${{ needs.check.result }}"; exit 1 ;;
          esac
          case "${{ needs.smoke.result }}" in
            success|skipped) ;;
            *) echo "smoke is ${{ needs.smoke.result }}"; exit 1 ;;
          esac
